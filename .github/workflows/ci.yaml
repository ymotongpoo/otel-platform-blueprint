name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: weaver registry check (policies)
        run: |
          docker run --rm -v "$PWD":/work -w /work otel/weaver:v0.25.1 \
            registry check -r registry/model -p registry/policies
      - name: weaver registry diff against main
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD":/work -w /work otel/weaver:v0.25.1 \
            registry diff -r registry/model \
            --baseline-registry "https://github.com/${{ github.repository }}.git@${{ github.base_ref }}[registry/model]"
      - name: verify generated code is up to date
        run: |
          # Weaver's image runs as UID 1000 (weaver), but the checkout is owned
          # by the runner user, so the container cannot write into the mount
          # ("Writing of the generated code ... failed: Permission denied").
          #
          # Running as the runner's UID fixes the write, but then the user has
          # no home directory inside the container and Weaver fails earlier
          # with "Cache directory not created: Permission denied". Point HOME
          # and the cache at a writable path under the mount.
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/work/.weaver-home \
            -v "$PWD":/work -w /work otel/weaver:v0.25.1 \
            registry generate -r registry/model --templates registry/templates go sdk/semconv
          rm -rf .weaver-home
          git diff --exit-code sdk/semconv

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build sdk
        run: cd sdk && go vet ./... && go build ./...
      - name: build services
        run: cd services && go vet ./... && go build ./...
      - name: build opamp server
        run: cd opamp/server && go vet ./... && go build ./...

  otelc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: otelc build from a clean module
        run: |
          cd autoinstrument/otelc
          # `otelc pin` is deliberately not used here. Upstream states that
          # committing a pin-generated otel.instrumentation.go is not supported
          # yet (opentelemetry-go-compile-instrumentation#585): the
          # instrumentation packages are pseudo-versioned and resolve only
          # inside the otelc executable, so `pin` fails with "package ... is
          # not part of a module" outside a local workflow.
          # `otelc go build` generates the configuration for the duration of
          # the build, which is the supported zero-configuration path.
          go tool otelc go build -o legacy-instrumented .
          ./legacy-instrumented & sleep 5
          curl -sf localhost:8082/legacy
          kill %1

  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OCB build
        run: docker build -t otelcol-internal:ci collector
      - name: validate configs with the built collector
        run: |
          docker run --rm -v "$PWD/collector/configs:/etc/otelcol:ro" \
            -e GATEWAY_ENDPOINT=gateway:4317 \
            otelcol-internal:ci validate --config /etc/otelcol/agent.yaml
          docker run --rm -v "$PWD/collector/configs:/etc/otelcol:ro" \
            -e TEMPO_ENDPOINT=tempo:4317 -e MIMIR_ENDPOINT=http://mimir:9009/otlp \
            -e LOKI_ENDPOINT=http://loki:3100/otlp \
            otelcol-internal:ci validate --config /etc/otelcol/gateway.yaml
