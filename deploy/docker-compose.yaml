name: otel-platform-blueprint

services:
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  mimir:
    image: grafana/mimir:2.17.1
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./mimir.yaml:/etc/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
      - mimir

  gateway:
    image: otelcol-internal:dev
    build: ../collector
    command: ["--config", "/etc/otelcol/gateway.yaml"]
    environment:
      TEMPO_ENDPOINT: tempo:4317
      MIMIR_ENDPOINT: http://mimir:9009/otlp
      LOKI_ENDPOINT: http://loki:3100/otlp
    volumes:
      - ../collector/configs/gateway.yaml:/etc/otelcol/gateway.yaml:ro
    depends_on:
      - tempo
      - loki
      - mimir

  opamp-server:
    image: blueprint-opamp-server:dev
    build: ../opamp/server
    environment:
      REMOTE_CONFIG_PATH: /etc/opamp/remote.yaml
    volumes:
      - ../opamp/remote-configs:/etc/opamp
    ports:
      - "4321:4321"

  agent:
    image: blueprint-supervised-agent:dev
    build: ../opamp/supervisor
    volumes:
      - ../opamp/supervisor/agent-base.yaml:/etc/otelcol/agent-base.yaml:ro
      - ../opamp/supervisor/supervisor.yaml:/etc/opampsupervisor/supervisor.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - gateway
      - opamp-server

  backend:
    image: blueprint-backend:dev
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: backend
    environment:
      OTEL_SERVICE_NAME: backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://agent:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,team.name=inventory
    depends_on:
      - agent

  frontend:
    image: blueprint-frontend:dev
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: frontend
    environment:
      OTEL_SERVICE_NAME: frontend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://agent:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,team.name=checkout
      BACKEND_URL: http://backend:8081
    ports:
      - "8080:8080"
    depends_on:
      - agent
      - backend

  ai-app:
    image: blueprint-ai-app:dev
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: ai-app
    environment:
      OTEL_SERVICE_NAME: ai-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://agent:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,team.name=ai
      BACKEND_URL: http://backend:8081
    ports:
      - "8083:8083"
    depends_on:
      - agent
      - backend

  uninstrumented:
    image: blueprint-uninstrumented:dev
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: uninstrumented
    ports:
      - "8082:8082"

volumes:
  tempo-data:
  mimir-data:
